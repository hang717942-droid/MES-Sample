<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>로그인 | MES</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="{{ url_for('static', filename='app.css') }}" rel="stylesheet"><link href="{{ url_for('static', filename='login.css') }}" rel="stylesheet"></head>
<body class="login-page"><main class="login-card"><div class="brand-mark login-mark">M</div><div class="eyebrow mt-3">SMART FACTORY</div><h1>MES 로그인</h1><p>운영자 계정으로 로그인하세요.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ category }} py-2 small">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><label class="form-label" for="username">사용자 이름</label><input class="form-control mb-3" id="username" name="username" autocomplete="username" required><label class="form-label" for="password">비밀번호</label><input class="form-control mb-4" type="password" id="password" name="password" autocomplete="current-password" required><button class="btn btn-primary w-100 py-2" type="submit">로그인</button></form></main></body></html>
