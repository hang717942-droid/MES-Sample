services:
  - type: web
    name: mes-sample
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: MES_DATABASE
        value: /tmp/mes.db
      - key: MES_USERNAME
        value: mesadmin
      - key: MES_PASSWORD
        generateValue: true
      - key: MES_SECURE_COOKIE
        value: "1"
        